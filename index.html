<style>
:root{
  --bg:#FBF8F1; --surface:#FFFFFF; --primary:#1F4E79; --primary-700:#17405F; --primary-100:#E4ECF5;
  --accent:#2A9D8F; --accent-100:#E2F3F0; --accent-700:#1E7A6E;
  --gold:#D9A441; --gold-100:#FBF1DA; --gold-700:#8A6414;

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0; font-family:"Heebo",system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--ink); line-height:1.6; -webkit-text-size-adjust:100%}
a{color:var(--primary); text-decoration:none} a:hover{text-decoration:underline}
.wrap{max-width:1180px; margin:0 auto; padding:0 18px}
.ltr,.num,.m{direction:ltr; unicode-bidi:isolate; display:inline-block}
.m{font-family:"STIX Two Math","Cambria Math",Georgia,serif; font-size:1.06em}
.tiny{font-size:12px; color:var(--muted)}
/* ---- topbar ---- */
.topbar{background:var(--surface); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:30}
.topbar-inner{display:flex; align-items:center; gap:14px; padding:10px 18px; max-width:1180px; margin:0 auto}
.brand{display:flex; align-items:center; gap:12px}
.brand .logo{width:42px; height:42px; border-radius:12px; background:linear-gradient(135deg,var(--primary),var(--accent)); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:900; font-size:18px}
.brand b{font-size:17px; font-weight:800; color:var(--primary)} .brand small{display:block; color:var(--muted); font-size:12px; font-weight:500}
.topbar-actions{margin-inline-start:auto; display:flex; align-items:center; gap:8px}
.icon-btn{background:var(--surface); border:1px solid var(--line); border-radius:10px; width:38px; height:38px; cursor:pointer; font-size:17px}
/* ---- nav ---- */
.nav{background:var(--surface); border-bottom:1px solid var(--line); position:sticky; top:63px; z-index:29}
.nav-inner{display:flex; gap:4px; max-width:1180px; margin:0 auto; padding:0 12px; overflow-x:auto; scrollbar-width:none}
.nav-inner::-webkit-scrollbar{display:none}
.nav-btn{background:none; border:none; border-bottom:3px solid transparent; padding:12px 14px; font:inherit; font-weight:700; color:var(--muted); cursor:pointer; white-space:nowrap; display:flex; align-items:center; gap:6px; min-height:46px}
.nav-btn:hover{color:var(--ink)} .nav-btn.active{color:var(--primary); border-bottom-color:var(--gold)}
/* ---- hero + journey ---- */
.hero{padding:34px 0 8px}
.eyebrow{color:var(--accent-700); font-weight:800; font-size:13px; letter-spacing:.3px}
.hero-title{font-size:clamp(28px,4.2vw,44px); font-weight:900; color:var(--primary); line-height:1.15; margin:4px 0 0}
.hero-sub{color:var(--ink-2); font-size:16px; margin-top:10px; max-width:72ch}
.hero-meta{display:flex; flex-wrap:wrap; gap:8px; margin-top:16px}
.chip{display:inline-flex; align-items:center; gap:6px; background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:5px 13px; font-size:13.5px; font-weight:600; color:var(--ink-2)}
.chip.blue{background:var(--primary-100); border-color:transparent; color:var(--primary-700)}
.chip.teal{background:var(--accent-100); border-color:transparent; color:var(--accent-700)}
.chip.gold{background:var(--gold-100); border-color:transparent; color:var(--gold-700)}
.chip.warn{background:var(--warn-100); border-color:transparent; color:var(--warn)}
.journey{margin:22px 0 6px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:18px 16px 12px; box-shadow:var(--shadow-sm); overflow-x:auto}
.journey .track{display:flex; align-items:flex-start; gap:0; min-width:760px; position:relative}
.journey .track::before{content:""; position:absolute; top:22px; right:30px; left:30px; height:4px; background:linear-gradient(90deg,var(--accent),var(--sky)); border-radius:2px; opacity:.45}
.journey .stn{flex:1; display:flex; flex-direction:column; align-items:center; text-align:center; position:relative; cursor:pointer; padding:0 3px}
.journey .stn .dot{width:44px; height:44px; border-radius:50%; background:var(--surface); border:3px solid var(--sky); display:flex; align-items:center; justify-content:center; font-weight:900; color:var(--primary); z-index:1; transition:.15s}
.journey .stn.done .dot{background:var(--accent); border-color:var(--accent); color:#fff}
.journey .stn.now .dot{background:var(--gold); border-color:var(--gold); color:#3a2f08; box-shadow:0 0 0 6px var(--gold-100)}
.journey .stn.selfstudy .dot{border-style:dashed; width:36px; height:36px; margin-top:4px; font-size:12px}
.journey .stn:hover .dot{transform:scale(1.08)}
.journey .stn .lab{font-size:12px; font-weight:700; color:var(--ink-2); margin-top:6px; line-height:1.3; max-width:110px}
.journey .stn .dt{font-size:11px; color:var(--muted)}
.journey .stn.milestone .dot{border-radius:12px; background:var(--primary); border-color:var(--primary); color:#fff}

.section{padding:26px 0 8px}

.section-head h2{font-size:23px; font-weight:800; margin:0; color:var(--primary)}
.section-head p{margin:0; color:var(--muted); font-size:14px}
.grid{display:grid; gap:16px} .grid.c2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))} .grid.c3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}

.card.hoverable:hover{transform:translateY(-3px); box-shadow:var(--shadow-md); border-color:var(--sky)}
.card h3{margin:0 0 6px; font-size:17px; color:var(--primary)}
.card p{margin:6px 0; color:var(--ink-2); font-size:14.5px}
.card.accent{border-inline-start:5px solid var(--accent)} .card.gold{border-inline-start:5px solid var(--gold)} .card.warn{border-inline-start:5px solid var(--warn)}

.btn-primary{background:linear-gradient(135deg,var(--primary),var(--accent-700)); color:#fff; box-shadow:var(--shadow-md)}

.links{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px}

.unit .sim{font-size:13px; color:var(--primary); background:var(--sky-100); border-radius:8px; padding:6px 10px; margin-top:6px}

table.cal{width:100%; border-collapse:collapse; background:var(--surface); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow-sm); font-size:14px}

.ann .d{font-size:12px; color:var(--muted)} .ann b{color:var(--primary)}
/* faq */
details{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:10px 16px; margin-bottom:8px}
summary{cursor:pointer; font-weight:700; color:var(--primary)}
input[type=password],input[type=text],textarea{font:inherit; padding:8px 10px; border:1px solid var(--line); border-radius:10px; width:100%; background:var(--bg)}
.footer{margin-top:44px; padding:26px 0 40px; border-top:1px solid var(--line); color:var(--muted); font-size:13px}
.footer b{color:var(--ink-2)}
.toast{position:fixed; bottom:18px; right:50%; transform:translateX(50%); background:var(--primary); color:#fff; padding:10px 18px; border-radius:12px; opacity:0; transition:.25s; z-index:50; pointer-events:none}
.toast.show{opacity:1}
.kbd{background:var(--sky-100); border-radius:6px; padding:0 6px; font-family:ui-monospace,monospace; font-size:.9em}
@media (max-width:700px){ .unit{grid-template-columns:1fr} .unit .n{width:44px; height:44px; font-size:18px} .nav{top:59px} }
@media print{ .topbar,.nav,.footer,.btn{display:none!important} }
</style>

function parseD(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function fmtDate(s){ if(!s) return "התאריך יעודכן"; const dt=parseD(s); return `יום ${HE_DAYS[dt.getDay()]}, ${dt.getDate()} ב${HE_MONTHS[dt.getMonth()]}`; }
function fmtShort(s){ if(!s) return "—"; const dt=parseD(s); return `${dt.getDate()}.${dt.getMonth()+1}`; }
function today(){ const t=new Date(); return new Date(t.getFullYear(),t.getMonth(),t.getDate()); }
function bidi(t){ return esc(t).replace(/(\d[\d.:]*\s?[–-]\s?\d[\d.:]*)/g,'<span class="num">$1</span>'); }
function esc(s){ return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function toast(msg){ const el=document.getElementById("toast"); el.textContent=msg; el.classList.add("show"); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove("show"),2200); }
function unit(id){ const base=UNITS.find(u=>u.id===id); return Object.assign({}, base, state.overrides["u"+id]||{}); }

function sessionStatus(s){ if(!s.date) return "future"; const t=today(), d=parseD(s.date); if(d.getTime()===t.getTime()) return "live"; return d<t?"past":"future"; }
const OFF_TYPES=["open","holiday"];
function sesTime(s){ return s.sem==="ב" ? "השעות יפורסמו" : "18:00–19:30"; }
function nextSession(){ return SESSIONS.map(s=>ses(s.n)).find(s=>s.date && !OFF_TYPES.includes(s.type) && parseD(s.date)>=today()) || null; }
function unitStatusNow(u){
  const ss=(u.sessions||[]).map(ses).filter(s=>s.date);
  if(!ss.length) return "future";
  if(ss.every(s=>parseD(s.date)<today())) return "done";
  if(ss.some(s=>sessionStatus(s)==="live") || (parseD(ss[0].date)<=today())) return "now";
  const nx=nextSession(); return (nx && nx.unit===u.id) ? "now" : "future";
}

function unitCard(u, full){
  const st=unitStatusNow(u);
  const ss=(u.sessions||[]).map(ses);
  const dates=ss.filter(s=>s.date).map(s=>fmtShort(s.date)).join(" · ");
  const ready=u.status==="ready";
  return `<div class="unit ${u.sessions&&u.sessions.length?"":"selfstudy"}" id="u${u.id}">
    <div class="n">${u.sessions&&u.sessions.length?u.id:"ל״ע"}</div>
    <div>
      <h3>יחידה ${u.id} — ${esc(u.title)}</h3>
      <div class="meta"><span class="tag">סמסטר ${u.sem}׳</span>${dates?`<span class="tag">${esc(dates)}</span>`:""}${u.selfstudy?`<span class="tag self">למידה עצמית</span>`:""}${st==="now"?`<span class="tag now">עכשיו</span>`:""}${u.status==="ready"?`<span class="tag now">מוכן</span>`:u.status==="soon"?`<span class="tag">בקרוב</span>`:""}</div>
      <div class="topics">${esc(u.topics||"")}</div>
      ${u.anchor?`<div class="topics" style="margin-top:6px"><b>העוגן:</b> ${esc(u.anchor)}</div>`:""}
      ${u.bridge?`<div class="bridge">🔗 ${esc(u.bridge)}</div>`:""}
      ${u.selfstudy?`<div class="bridge" style="background:var(--gold-100);color:var(--gold-700)">📦 ${esc(u.selfstudy)}</div>`:""}
      ${u.simName?`<div class="sim">🧪 סימולציה: <b>${esc(u.simName)}</b>${u.simDesc?" — "+esc(u.simDesc):""}</div>`:""}
      ${ready||full?`<div class="links">
        ${fileBtn("📘 מערך לתלמיד",u.student,true)} ${fileBtn("🗂️ דף סיכום",u.card)} ${fileBtn("✏️ תרגילי כיתה",u.exercises)} ${fileBtn("✅ פתרונות",u.solutions)}
        ${fileBtn("🏠 תרגיל בית",u.hw)} ${fileBtn("🏠 פתרון תרגיל הבית",u.hwsol)} ${fileBtn("🖥️ מצגת",u.slides)} ${fileBtn("🧪 הסימולציה",u.sim)}
      </div>${ssLinks(u)}`:""}

}
function pageUnits(){

  return `<section class="section"><div class="section-head"><h2>יחידות הקורס</h2><p>13 יחידות · יחידה 0 היא ההקדמה המתמטית</p></div>
    <h3 style="color:var(--accent-700)">סמסטר א׳ — מאנרגיה לאנטרופיה</h3>
    <div class="grid" style="gap:12px">${a.map(u=>`<div class="card hoverable">${unitCard(unit(u.id),false)}</div>`).join("")}</div>

function calRows(sem){
  return SESSIONS.filter(s=>s.sem===sem).map(s=>ses(s.n)).map(s=>{ const st=sessionStatus(s);
    const off=OFF_TYPES.includes(s.type), spec=["makeup","buffer","quiz","exam"].includes(s.type);
    const cls=off?"off":st==="past"?"past":st==="live"?"now":spec?"spec":"";
    const num=s.num!==undefined?s.num:s.type==="quiz"||s.type==="exam"?"🎓":s.type==="makeup"||s.type==="buffer"?"＋":"—";
    const when=s.date?fmtDate(s.date):(s.when||"התאריך יעודכן");
    return `<tr class="${cls}"><td>${num}</td><td>${bidi(when)}</td><td>${spec?"<b>":""}${bidi(s.title)}${spec?"</b>":""}${s.unit!==undefined?` <button class="btn btn-ghost btn-sm" data-go="units" data-anchor="u${s.unit}">ליחידה</button>`:""}</td><td class="tiny">${bidi(s.note||"")}</td></tr>`; }).join("");
}

  <p class="tiny">תאריכי ההגשה של תרגילי הבית הם ״יעד מומלץ״ — שבועיים אחרי הפרסום. שום דבר לא ״נסגר״ באתר.</p>

  <div class="grid c2">${UNITS.filter(u=>u.simName).map(u=>unit(u.id)).map(u=>`<div class="card hoverable ${u.sim?"accent":""}"><h3>🧪 ${esc(u.simName)}</h3><p class="tiny">יחידה ${u.id} — ${esc(u.title)}</p><p>${esc(u.simDesc||"בבנייה — תעלה עם היחידה")}</p><div class="links">${fileBtn("פתחו את הסימולציה",u.sim,true)}${u.sim?`<a class="btn btn-ghost btn-sm" href="${esc(u.sim)}#game" target="_blank" rel="noopener">★ ישר למשחק</a>`:""}</div></div>`).join("")}</div>
  <div class="card" style="margin-top:16px"><h3>איך המשחק עובד</h3><p>מקלידים את מספר התלמיד (1–50). הסימולציה מגרילה ממנו נתונים אישיים — שדות, מסלול, מצבי גז. משחקים, רושמים את הקריאות, לוחצים ״ייצוא הנתונים שלי״ ומצרפים את הטקסט לתרגיל הבית. בתרגיל מחשבים ביד את מה שהסימולציה הראתה — ומשווים.</p></div>

function pageQuiz(){
  return `<section class="section"><div class="section-head"><h2>הבוחן והמבחן</h2></div>
  <div class="grid c2">
    <div class="card warn"><h3>בוחן סוף סמסטר א׳</h3><p><b>מתי:</b> בתקופת הלמידה למבחנים שאחרי סוף הסמסטר (14.1.2027) — התאריך יעודכן.</p><p><b>מה:</b> יחידות 0–6. בלי דף נוסחאות. שאלות פיתוח: ״הראו ש…״, ״פתחו…״, ולצדן שאלות הבנה קצרות.</p><p><b>מיחידה 0:</b> שאלה אחת ישירה — נתון M dx + N dy: בדקו אוילר, שחזרו, חשבו לאורך מסלול. ובכל שאר השאלות הכלים בתוך הפיזיקה.</p><div class="links"><span class="btn btn-ghost btn-sm" aria-disabled="true">בוחן לדוגמה · יעלה לקראת השיעור ב-13.1</span></div></div>
    <div class="card"><h3>המבחן המסכם</h3><p>בתקופת המבחנים שאחרי 24.6.2027: שלוש שאלות פיתוח ושאלת בונוס, שלוש שעות, בלי דף נוסחאות. מבחן לדוגמה עם פתרון מלא יעלה בסמסטר ב׳.</p></div>
  </div>
  <div class="card gold" style="margin-top:16px"><h3>איך נראית שאלה טובה בקורס הזה</h3><p>״למערכת U = aVT⁴ ו-p = aT⁴/3: כתבו את dS, בדקו את קריטריון אוילר, שחזרו את S(T,V), וודאו את הזהות (∂U/∂V)_T = T(∂p/∂T)_V − p.״ — שאלת מבחן קלאסית, וזה חלק ד׳ של תרגיל בית 1.</p></div>
  </section>`;
}
function pageTools(){
  return `<section class="section"><div class="section-head"><h2>עזרים</h2><p>מילון, קבועים, מוסכמות — יתרחב עם היחידות</p></div>
  <div class="grid c2">
    <div class="card"><h3>קבועים ויחידות</h3><p><span class="m">R = 8.314 J mol⁻¹ K⁻¹</span> · <span class="m">1 bar = 10⁵ Pa</span> · <span class="m">1 L = 10⁻³ m³</span> · <span class="m">1 atm = 1.01325 bar</span> · <span class="m">k_B = 1.381×10⁻²³ J K⁻¹</span> · <span class="m">N_A = 6.022×10²³ mol⁻¹</span></p><p class="tiny">ג׳ול דורש מטרים מעוקבים ופסקל. ליטרים ובר לצד R = 8.314 — הטעות הנפוצה ביותר.</p></div>
    <div class="card"><h3>מוסכמות הקורס</h3><p>עבודה שנעשית <b>על</b> המערכת חיובית: <span class="m">đW = −p dV</span>. חום שנכנס למערכת חיובי. <span class="m">dU = đQ + đW</span>. הסימון đ לדיפרנציאל לא שלם. כל נגזרת חלקית עם אינדקס.</p></div>
    <div class="card"><h3>מילון — יחידה 0</h3><p><b>פונקציית מצב</b> — כמות שתלויה רק במצב; הדיפרנציאל שלה שלם. <b>קריטריון אוילר</b> — ∂M/∂y = ∂N/∂x. <b>דיפרנציאל לא שלם (đ)</b> — הקריטריון נכשל; אין פונקציה. <b>אינטגרל קווי</b> — סכימה לאורך מסלול, קטע-קטע. <b>גורם אינטגרציה</b> — פונקציה שהכפלה בה הופכת đ ל-d (למשל 1/T). <b>היחס הציקלי</b> — מכפלת שלוש הנגזרות = −1.</p></div>
    <div class="card"><h3>הטעויות שגובות ניקוד</h3><p>נגזרת בלי אינדקס · לגזור לפי המשתנה הלא נכון באוילר · ΔW · ספירה כפולה בשחזור · +1 ביחס הציקלי · הופכי עם אינדקסים שונים · ליטרים ובר ליד ג׳ול.</p></div>
  </div></section>`;
}
function pageFaq(){
  const q=[["מה צריך לדעת לפני הקורס?","כימיה כללית 1 (חום, עבודה, אנתלפיה, אנטרופיה, אנרגיה חופשית) וחשבון דיפרנציאלי ואינטגרלי של משתנה אחד. את כל השאר — פונקציות של כמה משתנים, דיפרנציאלים, זהויות — בונים ביחידה 0."],
  ["איך בנוי כל שיעור?","שעה וחצי (שתי שעות אקדמיות): הרצאה ותרגול משולבים. ״תרגול בכיתה״ מופיע בתוך המערך במקומות שבהם הוא נדרש, ופותרים אותו יחד. הפתרונות המלאים בחוברת התרגילים של היחידה."],
  ["מה זה ״למידה עצמית״?","ארבעה נושאים טכניים (ויריאל וואן דר ואלס, תרמוכימיה, קלפירון, לחץ אוסמוטי) נלמדים לבד מחבילה מורחבת: מערך מפורט, דוגמאות פתורות, סימולציה, סרטון קצר ותרגיל עם משוב. הם נכנסים לבוחן ולמבחן."],
  ["איך מגישים תרגילי בית?","פעם בשבוע, פתרון מלא, ״יעד מומלץ״ של שבועיים. חלק ג׳ של כל תרגיל דורש את ״ייצוא הנתונים שלי״ מהמשחק בסימולציה — מצרפים את הטקסט."],
  ["מה קורה אם שיעור מתבטל?","בסמסטר א׳ — יום השלמה (כבר מתוכנן אחד, על חנוכה). בסמסטר ב׳ שני השבועות האחרונים שמורים להשלמות. הלוח באתר מתעדכן."],];
  return `<section class="section"><div class="section-head"><h2>שאלות ומידע</h2></div>${q.map(([a,b])=>`<details><summary>${esc(a)}</summary><p>${esc(b)}</p></details>`).join("")}</section>`;
}
